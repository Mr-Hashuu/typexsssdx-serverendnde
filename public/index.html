<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<title>Typex Board Admin</title>
<link rel="icon" href="/logo.png">
<style>
:root{--bg:#0b0a14;--panel:#14121f;--panel2:#1a1727;--line:#262238;--tx:#ece9f7;--mut:#9a95b4;--acc:#a855f7;--acc2:#ec4899;--ok:#34d399;--bad:#f87171;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:50;transition:opacity .4s}
#splash img{width:84px;height:84px;border-radius:22px;animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 40px #a855f755}
.bar{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:slide 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.lg{width:100%;max-width:380px;text-align:center;animation:rise .5s both}
.lg img{width:72px;height:72px;border-radius:18px;margin-bottom:10px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:17px;margin:0 0 14px}
.mut{color:var(--mut)}.sm{font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:96px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--tx)}
.btn.danger{background:#3a1620;color:var(--bad);border:1px solid #5a2330}
.btn.block{width:100%;margin-top:18px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
#app{display:flex;min-height:100vh}
aside{width:230px;flex:none;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700}
.brand img{width:36px;height:36px;border-radius:10px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mut);background:none;border:0;cursor:pointer;text-align:left;width:100%;transition:background .2s,color .2s}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--panel)}.nav.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.sp{flex:1}
main{flex:1;min-width:0;padding:26px;max-width:980px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;animation:rise .4s both}
.stat b{display:block;font-size:28px;line-height:1.1;margin-top:6px}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.sec{margin-top:16px;animation:rise .4s both}
.vb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.vb em{font-style:normal;width:60px;flex:none;color:var(--mut)}
.vb .t{flex:1;height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.vb .t i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px;transition:width .6s}
.vb u{text-decoration:none;width:44px;text-align:right}
.item{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px;margin-top:10px}
.item .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#2a2142;color:#c9b6ff;margin-right:6px}
.pill.ok{background:#12342a;color:var(--ok)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.sw input{appearance:none;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{transform:translateX(20px)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:8px 10px}
td{padding:10px;border-top:1px solid var(--line)}
.sk{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#241f38;border:1px solid var(--line);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}#toast.bad{border-color:#5a2330;color:var(--bad)}
.cols{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut)}
.cols i{display:block;width:100%;min-height:3px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--acc2),var(--acc))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qb{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px;margin-top:12px}
.qb textarea{min-height:60px}
.qr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.qr label{margin:0;display:flex;align-items:center;gap:8px}
.btn.sm2{padding:8px 12px;font-size:13px}
a.btn{display:inline-block;text-decoration:none}
.wide .vb em{width:auto;max-width:46%;white-space:normal}
.tabs{display:none}
@media(max-width:820px){
 .two{grid-template-columns:1fr}
 aside{display:none}main{padding:16px 14px 96px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:#100e1a;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
 .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mut);font-size:11px;padding:6px 0;cursor:pointer}
 .tabs button svg{width:22px;height:22px}.tabs button.on{color:var(--acc)}
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tr{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 12px;margin-top:10px}
 td{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:10px}
 td::before{content:attr(data-l);color:var(--mut)}
}
</style>
</head>
<body>
<div id="splash"><img src="/logo.png" alt=""><div class="bar"><i></i></div></div>

<div id="login" class="hide">
  <div class="card lg">
    <img src="/logo.png" alt="">
    <h1>Typex Board Admin</h1>
    <div class="mut sm">Sign in to manage updates and notifications</div>
    <label for="pw" style="text-align:left">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="btn block" id="lbtn">Sign in</button>
  </div>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand"><img src="/logo.png" alt="">Typex Board</div>
    <button class="nav on" data-p="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Overview</button>
    <button class="nav" data-p="notify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>Notifications</button>
    <button class="nav" data-p="update"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>App updates</button>
    <button class="nav" data-p="devices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Phones</button>
    <button class="nav" data-p="survey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>Surveys</button>
    <div class="sp"></div>
    <button class="nav" id="out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
  </aside>
  <main><div id="view"></div></main>
  <nav class="tabs">
    <button class="on" data-p="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Overview</button>
    <button data-p="notify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>Notify</button>
    <button data-p="update"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>Update</button>
    <button data-p="devices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Phones</button>
    <button data-p="survey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>Survey</button>
    <button id="out2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
  </nav>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page = 'home', booted = false;

function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(toast.h); toast.h = setTimeout(() => t.className = '', 2600); }
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && url !== '/admin/login') { showLogin(); throw new Error('Login required'); }
  if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
function ago(ts) {
  if (!ts) return '-'; const s = Math.max(1, (Date.now() - ts) / 1000);
  if (s < 90) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago';
}
function showLogin() { $('#splash').classList.add('hide'); $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#pw').focus(); }
function showApp() { $('#splash').classList.add('hide'); $('#login').classList.add('hide'); $('#app').classList.remove('hide'); go(page); }

$('#lbtn').onclick = async () => {
  const b = $('#lbtn'); b.disabled = true; $('#lerr').textContent = '';
  try { await api('POST', '/admin/login', { password: $('#pw').value }); $('#pw').value = ''; showApp(); }
  catch (e) { $('#lerr').textContent = e.message; }
  b.disabled = false;
};
$('#pw').onkeydown = e => { if (e.key === 'Enter') $('#lbtn').click(); };
async function logout() { try { await api('POST', '/admin/logout', {}); } catch (e) {} showLogin(); }
$('#out').onclick = logout; $('#out2').onclick = logout;
$$('[data-p]').forEach(b => b.onclick = () => go(b.dataset.p));

function go(p) {
  page = p;
  $$('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  const v = $('#view'); v.innerHTML = '<div class="sk"></div><div class="sk sec"></div><div class="sk sec"></div>';
  ({ home, notify, update, devices, survey })[p]().catch(e => { if (e.message !== 'Login required') v.innerHTML = '<div class="card">' + esc(e.message) + '</div>'; });
}

async function home() {
  const s = await api('GET', '/admin/api/stats');
  const bd = s.breakdown || { models: [], sdks: [], daily: [] };
  const bars = (pairs, label) => {
    const max = Math.max(1, ...pairs.map(x => x[1]));
    return pairs.map(([k, n]) => `<div class="vb"><em>${esc(label ? label(k) : k)}</em><div class="t"><i style="width:${Math.round(n / max * 100)}%"></i></div><u>${n}</u></div>`).join('') || '<div class="mut">No data yet.</div>';
  };
  const dmax = Math.max(1, ...bd.daily.map(x => x.n));
  const cols = bd.daily.map(x => `<div title="${esc(x.d)}: ${x.n}"><span>${x.n || ''}</span><i style="height:${Math.round(x.n / dmax * 70)}%"></i><span>${esc(x.d.slice(8))}</span></div>`).join('');
  const l = s.latest;
  $('#view').innerHTML = `
  <div class="top"><div><h1>Overview</h1><div class="mut sm">Storage: ${esc(s.db)}${s.db === 'memory' ? ' (data is lost on restart, set MONGODB_URI)' : ''}</div></div><button class="btn ghost" onclick="go('home')">Refresh</button></div>
  <div class="grid">
    <div class="stat"><span>Phones connected</span><b>${s.total}</b></div>
    <div class="stat"><span>Active 24 hours</span><b>${s.active24h}</b></div>
    <div class="stat"><span>Active 7 days</span><b>${s.active7d}</b></div>
    <div class="stat"><span>New today</span><b>${s.new24h}</b></div>
    <div class="stat"><span>Survey answers</span><b>${s.surveyAnswers || 0}</b></div>
    <div class="stat"><span>Blocked phones</span><b>${s.blocked || 0}</b></div>
  </div>
  <div class="card sec"><h2>New phones, last 14 days</h2><div class="cols">${cols}</div></div>
  <div class="two">
    <div class="card sec wide"><h2>Versions in use</h2>${bars(Object.entries(s.versions).sort((a, b) => b[1] - a[1]).slice(0, 8))}</div>
    <div class="card sec wide"><h2>Android versions</h2>${bars(bd.sdks, k => k === '?' ? 'Unknown' : 'API ' + k)}</div>
  </div>
  <div class="card sec wide"><h2>Top phone models</h2>${bars(bd.models)}</div>
  <div class="card sec"><h2>Last notification</h2>${l ? `<b>${esc(l.title)}</b><p class="mut" style="margin:6px 0">${esc(l.text)}</p><span class="pill ok">Delivered to ${l.acks || 0} phones</span><span class="mut sm">${ago(l.ts)}</span>` : '<div class="mut">Nothing sent yet.</div>'}</div>`;
}

async function notify() {
  const { messages } = await api('GET', '/admin/api/messages');
  const list = messages.map(m => `<div class="item"><div class="h"><div><b>${esc(m.title)}</b><div class="mut sm">${ago(m.ts)}${m.before ? ' / phones older than ' + esc(m.before) : ' / all phones'}</div></div><button class="btn danger" data-del="${esc(m.id)}">Delete</button></div><p>${esc(m.text)}</p>${m.link ? `<div class="sm mut" style="margin-top:6px;word-break:break-all">${esc(m.link)}</div>` : ''}<div style="margin-top:8px"><span class="pill ok">Delivered to ${m.acks || 0} phones</span></div></div>`).join('') || '<div class="mut">No messages yet.</div>';
  $('#view').innerHTML = `
  <div class="top"><div><h1>Notifications</h1><div class="mut sm">Phones check for new messages in the background and when the keyboard opens</div></div></div>
  <div class="card">
    <label style="margin-top:0" for="nt">Title</label><input id="nt" type="text" maxlength="80" placeholder="Typex Board news">
    <label for="nx">Message</label><textarea id="nx" maxlength="600" placeholder="Write what every user should see"></textarea>
    <div class="mut sm" style="text-align:right"><span id="cnt">0</span>/600</div>
    <label for="nl">Link (optional, opens when tapped)</label><input id="nl" type="text" placeholder="https://">
    <label for="nb">Send to</label>
    <select id="nb"><option value="">All phones</option><option value="custom">Only phones older than a version</option></select>
    <input id="nv" class="hide" type="text" placeholder="Version, for example 2.9" style="margin-top:8px">
    <button class="btn block" id="send">Send to everyone</button>
  </div>
  <div class="sec"><h2>Sent messages</h2>${list}</div>`;
  $('#nx').oninput = e => $('#cnt').textContent = e.target.value.length;
  $('#nb').onchange = e => $('#nv').classList.toggle('hide', e.target.value !== 'custom');
  $('#send').onclick = async () => {
    const before = $('#nb').value === 'custom' ? $('#nv').value.trim() : '';
    if ($('#nb').value === 'custom' && !before) return toast('Enter a version', true);
    if (!confirm('Send this notification to ' + (before ? 'phones older than ' + before : 'every phone') + '?')) return;
    const b = $('#send'); b.disabled = true;
    try { await api('POST', '/admin/api/messages', { title: $('#nt').value, text: $('#nx').value, link: $('#nl').value, before }); toast('Sent'); go('notify'); }
    catch (e) { toast(e.message, true); b.disabled = false; }
  };
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this message?')) return;
    try { await api('DELETE', '/admin/api/messages/' + encodeURIComponent(b.dataset.del)); toast('Deleted'); go('notify'); } catch (e) { toast(e.message, true); }
  });
}

async function update() {
  const { setting: s, live } = await api('GET', '/admin/api/update');
  $('#view').innerHTML = `
  <div class="top"><div><h1>App updates</h1><div class="mut sm">Phones check hourly, download the APK and offer the install</div></div></div>
  <div class="card">
    <h2>Live feed right now</h2>
    <span class="pill">Version ${esc(live.versionName)}</span>${live.force ? '<span class="pill" style="background:#3a1620;color:var(--bad)">Required</span>' : ''}
    <div class="sm mut" style="margin-top:8px;word-break:break-all">${esc(live.apk || 'No APK link')}</div>
  </div>
  <div class="card sec">
    <div class="seg" id="mode"><button data-m="manual">Manual</button><button data-m="github">GitHub releases</button></div>
    <div id="man">
      <label for="uv">New version</label><input id="uv" type="text" placeholder="2.9" value="${esc(s.version)}">
      <label for="ua">APK download link</label><input id="ua" type="text" placeholder="https://github.com/you/repo/releases/download/v2.9/Lipi-2.9.apk" value="${esc(s.apk)}">
      <label for="up">Page link (optional)</label><input id="up" type="text" value="${esc(s.page)}">
    </div>
    <div id="gh" class="hide">
      <label for="ur">GitHub repo (owner/name)</label><input id="ur" type="text" placeholder="Mr-Hashuu/flashboard-keyboard" value="${esc(s.repo)}">
      <div class="mut sm" style="margin-top:8px">The newest release and its APK are used automatically. Put [force] in the release notes to make it required.</div>
    </div>
    <label for="un">What is new</label><textarea id="un" maxlength="700" placeholder="One line per change">${esc(s.notes)}</textarea>
    <div class="sw"><div><b>Required update</b><div class="mut sm">Phones behind this version show an update screen until they install</div></div><input type="checkbox" id="uf" ${s.force ? 'checked' : ''}></div>
    <button class="btn block" id="pub">Publish update</button>
  </div>`;
  let mode = s.mode === 'github' ? 'github' : 'manual';
  const paint = () => { $$('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === mode)); $('#man').classList.toggle('hide', mode !== 'manual'); $('#gh').classList.toggle('hide', mode !== 'github'); };
  $$('#mode button').forEach(b => b.onclick = () => { mode = b.dataset.m; paint(); }); paint();
  $('#pub').onclick = async () => {
    if (!confirm('Publish this update to every phone?')) return;
    const b = $('#pub'); b.disabled = true;
    try {
      await api('POST', '/admin/api/update', { mode, version: $('#uv').value, apk: $('#ua').value, page: $('#up').value, repo: $('#ur').value, notes: $('#un').value, force: $('#uf').checked });
      toast('Update published'); go('update');
    } catch (e) { toast(e.message, true); b.disabled = false; }
  };
}

async function devices() {
  $('#view').innerHTML = `<div class="top"><div><h1>Phones</h1><div class="mut sm">Search by model, version or id. Phones are anonymous.</div></div><a class="btn ghost" href="/admin/api/devices.csv">Download CSV</a></div>
  <div class="row"><input id="dq" type="text" placeholder="Search phones, for example Redmi or 2.9" maxlength="40"><select id="df"><option value="">All phones</option><option value="1">Blocked only</option></select></div>
  <div class="card sec" style="padding:8px 12px" id="dl"></div>`;
  let timer;
  const load = async () => {
    const { devices: d } = await api('GET', '/admin/api/devices?q=' + encodeURIComponent($('#dq').value.trim()) + ($('#df').value ? '&blocked=1' : ''));
    const rows = d.map(x => `<tr><td data-l="Phone">${esc(x.model || 'Unknown')}${x.blocked ? ' <span class="pill" style="background:#3a1620;color:var(--bad)">Blocked</span>' : ''}${x.blocked && x.reason ? `<div class="mut sm">${esc(x.reason)}</div>` : ''}</td><td data-l="Version">${esc(x.v)}</td><td data-l="Android">${x.sdk ? 'API ' + esc(x.sdk) : '-'}</td><td data-l="Last seen">${ago(x.last)}</td><td data-l="First seen">${ago(x.first)}</td><td><button class="btn ${x.blocked ? 'ghost' : 'danger'} sm2" data-bk="${esc(x.id)}" data-bs="${x.blocked ? '' : '1'}">${x.blocked ? 'Unblock' : 'Block'}</button> <button class="btn ghost sm2" data-rm="${esc(x.id)}">Remove</button></td></tr>`).join('');
    $('#dl').innerHTML = rows ? `<div class="mut sm" style="padding:6px 4px">Showing ${d.length} phones (most recent 200)</div><table><thead><tr><th>Phone</th><th>Version</th><th>Android</th><th>Last seen</th><th>First seen</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="mut" style="padding:12px">No phones found.</div>';
    $$('[data-bk]').forEach(b => b.onclick = async () => {
      const block = !!b.dataset.bs; let reason = '';
      if (block) { reason = prompt('Block this phone from the Typex server (updates, messages, survey). Reason, shown to you only (optional):', ''); if (reason === null) return; }
      else if (!confirm('Unblock this phone?')) return;
      try { await api('POST', '/admin/api/devices/block', { id: b.dataset.bk, blocked: block, reason }); toast(block ? 'Phone blocked' : 'Phone unblocked'); load(); } catch (e) { toast(e.message, true); }
    });
    $$('[data-rm]').forEach(b => b.onclick = async () => {
      if (!confirm('Remove this phone from the list? It appears again the next time it connects.')) return;
      try { await api('DELETE', '/admin/api/devices/' + encodeURIComponent(b.dataset.rm)); toast('Removed'); load(); } catch (e) { toast(e.message, true); }
    });
  };
  $('#df').onchange = () => load().catch(e => toast(e.message, true));
  $('#dq').oninput = () => { clearTimeout(timer); timer = setTimeout(() => load().catch(e => toast(e.message, true)), 300); };
  await load();
}

async function survey() {
  const r = await api('GET', '/admin/api/survey');
  const sv = r.survey;
  const res = r.results.map(q => {
    const max = Math.max(1, ...q.options.map(o => o.n));
    return `<div style="margin-top:16px"><b>${esc(q.q)}</b>${q.multi ? ' <span class="pill">multiple</span>' : ''}${q.options.map(o => `<div class="vb"><em>${esc(o.o)}</em><div class="t"><i style="width:${Math.round(o.n / max * 100)}%"></i></div><u>${o.n}${r.count ? ' · ' + Math.round(o.n / r.count * 100) + '%' : ''}</u></div>`).join('')}</div>`;
  }).join('');
  $('#view').innerHTML = `
  <div class="top"><div><h1>Surveys</h1><div class="mut sm">Questions appear in the app dashboard. Phones answer once and can change their answer.</div></div></div>
  <div class="card wide">
    <div class="h" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <div><h2 style="margin:0">${esc(sv.title)}</h2><span class="pill ok">${r.count} answers</span>${r.isDefault ? '<span class="pill">built-in questions</span>' : '<span class="pill">live</span>'}</div>
      <div><a class="btn ghost sm2" href="/admin/api/survey.csv">Download CSV</a> <button class="btn danger sm2" id="sclr">Clear answers</button></div>
    </div>${res}
  </div>
  <div class="card sec">
    <h2>${r.isDefault ? 'Create a survey' : 'Publish a new survey'}</h2>
    <div class="mut sm">Publishing replaces the live survey. Phones get the new questions the next time they open the app and can answer again. Old answers stay saved but are no longer shown.</div>
    <label for="stt">Survey title</label><input id="stt" type="text" maxlength="60" value="${esc(sv.title)}">
    <div id="qs"></div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="addq">Add question</button><button class="btn" id="spub">Publish survey</button></div>
  </div>`;
  const qs = sv.questions.map(q => ({ q: q.q, options: q.options.join('\n'), multi: !!q.multi }));
  const draw = () => {
    $('#qs').innerHTML = qs.map((q, i) => `<div class="qb"><div class="qr" style="margin-top:0"><b>Question ${i + 1}</b>${qs.length > 1 ? `<button class="btn danger sm2" data-rq="${i}">Remove</button>` : ''}</div>
      <label>Question</label><textarea data-q="${i}" maxlength="200">${esc(q.q)}</textarea>
      <label>Answers, one per line (2 to 8)</label><textarea data-o="${i}" maxlength="600">${esc(q.options)}</textarea>
      <div class="qr"><label><input type="checkbox" data-m="${i}" ${q.multi ? 'checked' : ''}> Allow more than one answer</label></div></div>`).join('');
    $$('[data-q]').forEach(t => t.oninput = () => { qs[t.dataset.q].q = t.value; });
    $$('[data-o]').forEach(t => t.oninput = () => { qs[t.dataset.o].options = t.value; });
    $$('[data-m]').forEach(t => t.onchange = () => { qs[t.dataset.m].multi = t.checked; });
    $$('[data-rq]').forEach(b => b.onclick = () => { qs.splice(+b.dataset.rq, 1); draw(); });
    $('#addq').classList.toggle('hide', qs.length >= 10);
  };
  draw();
  $('#addq').onclick = () => { if (qs.length < 10) { qs.push({ q: '', options: '', multi: false }); draw(); } };
  $('#spub').onclick = async () => {
    if (!confirm('Publish this survey to every phone?')) return;
    const b = $('#spub'); b.disabled = true;
    try {
      await api('POST', '/admin/api/survey', { title: $('#stt').value, questions: qs.map(q => ({ q: q.q, options: q.options.split('\n'), multi: q.multi })) });
      toast('Survey published'); go('survey');
    } catch (e) { toast(e.message, true); b.disabled = false; }
  };
  $('#sclr').onclick = async () => {
    if (!confirm('Delete all ' + r.count + ' answers of this survey? This cannot be undone.')) return;
    try { await api('POST', '/admin/api/survey/clear', {}); toast('Answers cleared'); go('survey'); } catch (e) { toast(e.message, true); }
  };
}

(async () => {
  try { await api('GET', '/admin/api/me'); showApp(); } catch (e) { showLogin(); }
})();
</script>
</body>
